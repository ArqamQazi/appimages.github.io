name: Update AppImage AppStream Database
on:
  push:
    branches:
      - master
      - main
  schedule:
    - cron: '0 0,12 * * *' # Runs twice a day at midnight and noon UTC
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Run Extraction Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python extractor.py
        
      - name: Commit and Push Changes
        run: |
          git config --global user.name "AppStore Bot"
          git config --global user.email "bot@example.com"
          git add database/
          git commit -m "Auto-update AppStream database with latest releases" || echo "No changes to commit"
          git push
